*{box-sizing:border-box}
body{margin:0;background:#13191F;color:#E9E4DC;font-family:Archivo,"Segoe UI",system-ui,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lbl,h1,.row,.sp{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
h1{animation-delay:.05s}.row{animation-delay:.15s}.sp{animation-delay:.2s}
.lbl{font-size:11px;letter-spacing:.16em;color:#8A8F95;text-transform:uppercase;transition:color .4s}
h1{margin:0 0 12px;font-size:26px;font-weight:700;color:#C99A5B}
.row{display:flex;align-items:center;gap:10px}
.val{min-width:68px;text-align:right;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.val small{margin-left:5px;font-size:13px;color:#8A8F95}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:8px;outline:none;margin:0;
background:linear-gradient(to right,#C99A5B var(--p,10%),#27313A var(--p,10%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.55);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.1)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.tg{position:relative;width:92px;height:36px;border-radius:18px;background:#2A343D;cursor:pointer;font-weight:700;font-size:13px;user-select:none;overflow:hidden;color:#8A8F95;transition:color .3s,transform .15s}
.tg:active{transform:scale(.95)}
.tg::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#B07F3F,#E0B677);opacity:0;transition:opacity .35s}
.tg span{position:absolute;top:50%;transform:translateY(-50%);left:46px;transition:left .38s cubic-bezier(.34,1.56,.64,1)}
.tg i{position:absolute;z-index:1;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:left .38s cubic-bezier(.34,1.56,.64,1)}
.tg.on{color:#13191F}.tg.on::before{opacity:1}.tg.on span{left:16px}.tg.on i{left:59px}
button{background:#1D262E;color:#C99A5B;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .25s}
button:hover{background:#232E37}
button:active{transform:scale(.92)}


body{width:320px;padding:16px 18px 14px}
.sp{display:flex;justify-content:center;margin-top:15px}
.ph{margin-top:9px;text-align:center;animation:rise .7s cubic-bezier(.2,.8,.2,1) .25s backwards}
#qr{width:150px;height:150px;margin:13px auto 0;background:#fff;border-radius:12px;padding:6px;transition:opacity .3s}
#qr svg{width:100%;height:100%;display:block}
.lk{display:flex;align-items:center;gap:8px;margin-top:8px}
#u a{color:inherit;text-decoration:underline;cursor:pointer}
#u{flex:1;text-align:left;font-size:11px;color:#C99A5B;word-break:break-all;line-height:1.4}
.ic{width:36px;height:36px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.ic.done svg{transform:scale(1.2)}
.acc{margin-top:4px;text-align:left}
.at{background:none;padding:6px 0;border-radius:0;color:#8A8F95;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.at:hover{background:none;color:#C99A5B}.at svg{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.at.open svg{transform:rotate(180deg)}
.ab{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1),opacity .35s}
.ab.open{grid-template-rows:1fr;opacity:1}
.ai{overflow:hidden;min-height:0;padding:0 2px}
#r svg{transition:transform .6s cubic-bezier(.4,0,.2,1)}
#base{width:100%;margin:6px 0 2px;background:#1D262E;border:0;border-radius:8px;padding:9px;color:#E9E4DC;font:inherit;font-size:12px}
.hint{margin-top:14px;font-size:11px;line-height:1.4;color:#C99A5B;text-align:center;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s cubic-bezier(.2,.8,.2,1),opacity .35s}
.hint.on{max-height:60px;opacity:1}
