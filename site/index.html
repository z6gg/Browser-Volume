*{box-sizing:border-box}
body{margin:0;background:#13191F;color:#E9E4DC;font-family:Archivo,"Segoe UI",system-ui,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lbl,h1,.big,.row,.sp,details{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards}
h1{animation-delay:.05s}.big{animation-delay:.1s}.row{animation-delay:.15s}.sp{animation-delay:.2s}details{animation-delay:.25s}
.lbl{font-size:11px;letter-spacing:.16em;color:#8A8F95;text-transform:uppercase;transition:color .4s}
.lbl.ok{color:#C99A5B}
h1{margin:4px 0 20px;font-size:26px;font-weight:700;color:#C99A5B}
.row{display:flex;align-items:center;gap:14px}
.val{min-width:72px;text-align:right;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.val small{font-size:13px;color:#8A8F95}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:8px;outline:none;margin:0;
background:linear-gradient(to right,#C99A5B var(--p,10%),#27313A var(--p,10%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.55);transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.1)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.tg{position:relative;width:92px;height:36px;border-radius:18px;background:#2A343D;cursor:pointer;font-weight:700;font-size:13px;user-select:none;overflow:hidden;color:#8A8F95;transition:color .3s,transform .15s}
.tg:active{transform:scale(.95)}
.tg::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#B07F3F,#E0B677);opacity:0;transition:opacity .35s}
.tg span{position:absolute;top:50%;transform:translateY(-50%);left:46px;transition:left .38s cubic-bezier(.34,1.56,.64,1)}
.tg i{position:absolute;z-index:1;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:left .38s cubic-bezier(.34,1.56,.64,1)}
.tg.on{color:#13191F}.tg.on::before{opacity:1}.tg.on span{left:16px}.tg.on i{left:59px}
button{background:#1D262E;color:#C99A5B;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s cubic-bezier(.34,1.56,.64,1),background .25s}
button:hover{background:#232E37}
button:active{transform:scale(.92)}

body{padding:36px 24px;max-width:460px;margin:0 auto;text-align:center}
h1{font-size:34px;margin:6px 0 0}
.big{font-size:84px;font-weight:700;margin:40px 0 24px;font-variant-numeric:tabular-nums}.big small{font-size:28px;color:#8A8F95}
input[type=range]{height:12px;width:auto}
input[type=range]::-webkit-slider-thumb{width:34px;height:34px}
.sp{justify-content:center;display:flex;margin-top:44px}
.tg{width:110px;height:44px;border-radius:22px;font-size:15px}
.tg span{left:58px}.tg i{width:38px;height:38px}.tg.on span{left:20px}.tg.on i{left:69px}
.ic{width:44px;height:44px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{transition:transform .6s cubic-bezier(.4,0,.2,1)}
.big,.row,.sp{transition:opacity .35s}
.sp+.sp{margin-top:24px}
.dis .big,.dis .row,.dis .sp{opacity:.35;pointer-events:none}
